spring:
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8080/realms/turkcell-realm
    application:
        name: config-server
    cloud:
        config:
            server:
                git: 
                    uri: https://github.com/IBRAHIMMCETIN/Microservices-Spring.git
                    default-label: main
                    search-paths: microservices/configs,microservices/configs/{application}
                    clone-on-start: true
                    force-pull: true
                    
                
server:
    port: 8889