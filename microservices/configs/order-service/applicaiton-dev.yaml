spring:
  cloud:
    stream:
      bindings:
        orderCreatedEvent-out-0:
          destination: order-created-topic
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092
  datasource:
    url: jdbc:postgresql://localhost:5433/products # Eğer ayrı bir order-db açarsan port/db adını güncellersin reis
    username: postgres
    password: test12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/